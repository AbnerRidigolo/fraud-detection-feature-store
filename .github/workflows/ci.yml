# CI do projeto Fraud Detection Feature Store.
#
# Dois jobs, de propósito:
#   - lint-test: barato e rápido (ruff + black + testes unitários, sem Redis).
#   - e2e: sobe um Redis de verdade e roda o pipeline COMPLETO em escala pequena.
#     É a prova de que offline -> apply -> materialize -> train -> online funciona
#     de ponta a ponta, não só em teoria.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Instala dependências
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src tests feature_repo
      - name: Formatação (black)
        run: black --check src tests feature_repo
      - name: Testes unitários
        run: pytest -q

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_CONNECTION_STRING: localhost:6379
      # Escala pequena para o CI rodar rápido.
      FRAUD_FS_N_CUSTOMERS: "40"
      FRAUD_FS_N_DAYS: "20"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Instala dependências
        run: pip install -e .
      - name: Pipeline end-to-end (gera -> materializa -> treina -> infere)
        run: bash scripts/run_pipeline.sh
      - name: Medir a API com Feast e Redis
        shell: bash
        run: |
          python -m uvicorn fraud_fs.serve:app --host 127.0.0.1 --port 8000 > /tmp/fraud-uvicorn.log 2>&1 &
          api_pid=$!
          trap 'status=$?; kill "$api_pid" 2>/dev/null || true; if [ "$status" -ne 0 ]; then cat /tmp/fraud-uvicorn.log; fi' EXIT
          curl --fail --silent --show-error --retry 8 --retry-connrefused --max-time 3 http://127.0.0.1:8000/health
          python -m fraud_fs.benchmark --requests 100 --warmup 10 \
            --environment "GitHub Actions ubuntu-latest, Python 3.11, Uvicorn com 1 worker e Redis 7 como serviço local" \
            | tee latency.json
          {
            echo '### Latência de POST /score (carga sintética)'
            echo '```json'
            cat latency.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: fraud-score-latency
          path: latency.json
